<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة أسئلة الأمان - بنكك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background-color: #b91c23; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; color: white; border-bottom: 3px solid #8a1117; position: relative; }
        .header h1 { font-size: 28px; font-weight: bold; letter-spacing: 1px; }
        .header h1 span { color: #dcb310; }
        .menu-icon { font-size: 24px; cursor: pointer; }
        
        .top-bar { background-color: #555; color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
        .top-bar h2 { font-size: 18px; font-weight: 500; }
        .btn-back { background-color: transparent; color: #b91c23; border: 2px solid #b91c23; padding: 5px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-back:hover { background-color: #b91c23; color: white; }

        .main-container { flex: 1; padding: 20px; max-width: 500px; margin: 0 auto; width: 100%; }
        
        .question-box { background-color: #555; border: 1px solid #444; margin-bottom: 15px; display: flex; flex-direction: column; }
        .question-header { background-color: #666; padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #444; }
        .question-header span { color: #ccc; font-size: 14px; }
        .question-header .selected-q { color: #fff; font-size: 16px; margin-top: 5px; }
        
        .answer-box { padding: 15px; display: flex; align-items: center; gap: 10px; background-color: #777; }
        .answer-box i { color: #333; font-size: 20px; }
        .answer-box input { width: 100%; background: transparent; border: none; outline: none; color: #222; font-size: 16px; font-weight: 500; }
        .answer-box input::placeholder { color: #333; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background-color: #fff; border-radius: 10px; width: 100%; max-width: 450px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-header { background-color: #ff0000; color: white; padding: 15px; text-align: right; font-size: 18px; font-weight: bold; }
        
        .modal-options { padding: 10px 0; }
        .option-item { padding: 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .option-item:hover { background-color: #f9f9f9; }
        .option-item input[type="radio"] { appearance: none; width: 22px; height: 22px; border: 2px solid #ff0000; border-radius: 50%; outline: none; cursor: pointer; position: relative; }
        .option-item input[type="radio"]:checked { background-color: #ff0000; }
        .option-item label { font-size: 15px; color: #333; cursor: pointer; width: 100%; }

        .modal-footer { padding: 15px; display: flex; justify-content: center; gap: 15px; background-color: #fff; }
        .btn-modal { padding: 10px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; color: white; }
        .btn-cancel { background-color: #ff0000; }
        .btn-agree { background-color: #ff0000; }
        
        .btn-verify { width: 100%; padding: 15px; background-color: #b91c23; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="header">
        <h1>بنك <span>bankak</span></h1>
        <i class="fa-solid fa-bars menu-icon"></i>
    </header>

    <div class="top-bar">
        <button class="btn-back" onclick="window.location.href='individual.html'"><i class="fa-solid fa-chevron-right"></i> رجوع</button>
        <h2>إدارة أسئلة الأمان</h2>
    </div>

    <main class="main-container">
        <form action="#" onsubmit="event.preventDefault(); window.location.href='otp.html';">
            <div class="question-box">
                <div class="question-header" onclick="openModal(1)">
                    <div><span>اختر سؤالا</span><div class="selected-q" id="q1-text">إختر السؤال الأول</div></div>
                    <i class="fa-solid fa-caret-down" style="color: black; font-size: 20px;"></i>
                </div>
                <div class="answer-box"><i class="fa-regular fa-comment-dots"></i><input type="text" placeholder="أدخل الجواب"></div>
            </div>

            <div class="question-box">
                <div class="question-header" onclick="openModal(2)">
                    <div><span>اختر سؤالا</span><div class="selected-q" id="q2-text">إختر السؤال الثاني</div></div>
                    <i class="fa-solid fa-caret-down" style="color: black; font-size: 20px;"></i>
                </div>
                <div class="answer-box"><i class="fa-regular fa-comment-dots"></i><input type="text" placeholder="أدخل الجواب"></div>
            </div>

            <div class="question-box">
                <div class="question-header" onclick="openModal(3)">
                    <div><span>اختر سؤالا</span><div class="selected-q" id="q3-text">إختر السؤال الثالث</div></div>
                    <i class="fa-solid fa-caret-down" style="color: black; font-size: 20px;"></i>
                </div>
                <div class="answer-box"><i class="fa-regular fa-comment-dots"></i><input type="text" placeholder="أدخل الجواب"></div>
            </div>

            <div class="question-box">
                <div class="question-header" onclick="openModal(4)">
                    <div><span>اختر سؤالا</span><div class="selected-q" id="q4-text">إختر السؤال الرابع</div></div>
                    <i class="fa-solid fa-caret-down" style="color: black; font-size: 20px;"></i>
                </div>
                <div class="answer-box"><i class="fa-regular fa-comment-dots"></i><input type="text" placeholder="أدخل الجواب"></div>
            </div>

            <div class="question-box">
                <div class="question-header" onclick="openModal(5)">
                    <div><span>اختر سؤالا</span><div class="selected-q" id="q5-text">إختر السؤال الخامس</div></div>
                    <i class="fa-solid fa-caret-down" style="color: black; font-size: 20px;"></i>
                </div>
                <div class="answer-box"><i class="fa-regular fa-comment-dots"></i><input type="text" placeholder="أدخل الجواب"></div>
            </div>
            
            <button type="submit" class="btn-verify">Verify & Continue</button>
        </form>
    </main>

    <div id="optionsModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">إختار السؤال</div>
            <div class="modal-options" id="modalOptions"></div>
            <div class="modal-footer">
                <button type="button" class="btn-modal btn-cancel" onclick="closeModal()">إلغاء</button>
                <button type="button" class="btn-modal btn-agree" onclick="confirmSelection()">موافق</button>
            </div>
        </div>
    </div>

    <script>
        const questionsData = {
            1: ["ما هو اسم ابن عمك الأول؟", "في أي مدينة ولدت؟", "في أي سنة تخرجت من الجامعة؟"],
            2: ["ماذا كان لقبك اثناء الطفولة؟", "اسم مؤلفك المفضل؟", "اسم الشركة المصنعة للسيارة المفضلة لديك؟"],
            3: ["أي فيلم هو المفضل لديك؟", "اسم أفضل صديق في الطفولة؟", "في أي عام حصلت على رخصة القيادة الخاصة بك؟"],
            4: ["العلامة التجارية لأول تلفزيون خاص بك؟", "في أي سنة تزوجت؟", "اسم فريق كرة القدم المفضل لديك؟"],
            5: ["ما هو اسم المدرسة التي التحقت بها؟", "اسم أول بلد أجنبي قمت بزيارته؟", "ما هي ماركة سيارتك الأولى؟"]
        };

        let currentQuestionNum = null;
        let selectedOptionText = "";

        function openModal(qNum) {
            currentQuestionNum = qNum;
            const modal = document.getElementById('optionsModal');
            const title = document.getElementById('modalTitle');
            const optionsContainer = document.getElementById('modalOptions');
            const titles = ["الأول", "الثاني", "الثالث", "الرابع", "الخامس"];
            title.innerText = "إختر السؤال " + titles[qNum - 1];
            let html = '';
            questionsData[qNum].forEach((q, index) => {
                html += `<div class="option-item" onclick="selectOption(this, '${q}')"><input type="radio" name="q_option" id="opt_${qNum}_${index}"><label for="opt_${qNum}_${index}">${q}</label></div>`;
            });
            optionsContainer.innerHTML = html;
            selectedOptionText = ""; 
            modal.style.display = 'flex';
        }

        function selectOption(element, text) {
            document.querySelectorAll('.option-item input[type="radio"]').forEach(radio => radio.checked = false);
            element.querySelector('input[type="radio"]').checked = true;
            selectedOptionText = text;
        }

        function closeModal() { document.getElementById('optionsModal').style.display = 'none'; }

        function confirmSelection() {
            if (selectedOptionText !== "") {
                document.getElementById('q' + currentQuestionNum + '-text').innerText = selectedOptionText;
                closeModal();
            } else { alert("الرجاء اختيار سؤال أولاً"); }
        }
    </script>
</body>
</html>
