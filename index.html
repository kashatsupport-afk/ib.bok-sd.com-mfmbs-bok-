<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Khartoum - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fafafa;
            /* خلفية هندسية خفيفة جداً */
            background-image: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0),
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------------- الهيدر (أحمر سادة والشعار في النص) ---------------- */
        .header {
            background-color: #d31a22; /* اللون الأحمر */
            padding: 15px 20px;
            display: flex;
            justify-content: center; /* توسيط الشعار */
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-logo {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        /* ---------------- المحتوى الرئيسي ---------------- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* بطاقة تسجيل الدخول */
        .login-card {
            background-color: white;
            border-radius: 10px;
            padding: 25px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        .login-card h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* الأزرار الحمراء */
        .btn-login {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: linear-gradient(to right, #d31a22, #b31217); /* تدرج أحمر */
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .btn-login-content {
            display: flex; 
            align-items: center;
            gap: 15px; /* مسافة بين الأيقونة والكلام */
        }

        .btn-login-content i {
            font-size: 20px; /* حجم الأيقونة البيضاء */
        }

        .btn-login .fa-arrow-right {
            font-size: 16px;
        }

        /* ---------------- شبكة الصناديق الأربعة ---------------- */
        .icon-grid {
            display: grid;
            grid-template-columns: 1fr; /* في الموبايل تحت بعض */
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .icon-box {
            background-color: white;
            border-radius: 10px;
            padding: 20px 10px; /* مساحة داخلية معقولة مش ضخمة */
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            font-size: 14px;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        /* تصميم الأيقونات المركبة (شخص + (i) / ورقة + صح / دبوس + بيضاوي) */
        .custom-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .custom-icon .main-icon {
            font-size: 30px;
            color: #222; /* لون أسود */
        }

        .custom-icon .badge {
            position: absolute;
            bottom: -2px;
            right: -5px;
            background-color: #d31a22;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        /* أيقونة الاتصال (تليفون + ظرف) */
        .contact-icon {
            position: relative;
            width: 40px;
            height: 40px;
        }
        .contact-icon .fa-phone {
            font-size: 28px;
            color: #222;
            position: absolute;
            left: 0;
            bottom: 0;
        }
        .contact-icon .fa-envelope {
            font-size: 20px;
            color: #d31a22;
            position: absolute;
            right: 0;
            top: 5px;
        }

        /* البيضاوي اللي تحت دبوس الموقع */
        .pin-oval {
            position: relative;
            display: inline-block;
            margin-bottom: 5px;
        }
        .pin-oval .fa-location-dot {
            font-size: 30px;
            color: #222;
            z-index: 2;
            position: relative;
        }
        .pin-oval::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 8px;
            border: 2px solid #d31a22;
            border-radius: 50%;
            z-index: 1;
        }

        /* ---------------- تظبيط اللابتوب ---------------- */
        @media (min-width: 768px) {
            .main-container {
                padding-top: 40px;
            }
            .icon-grid {
                /* في اللابتوب 4 بالعرض */
                grid-template-columns: repeat(4, 1fr); 
            }
            .icon-box {
                padding: 25px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="header">
        <!-- الصورة اللي أنت رفعتها، لو عايز الشعار الكامل زي الموقع الأصلي غير الصورة -->
        <img src="i9oXDFd8_400x400.jpg" alt="Bank of Khartoum Logo" class="header-logo">
    </header>

    <!-- المحتوى -->
    <main class="main-container">
        
        <div class="login-card">
            <h3>Login to</h3>
            
            <button class="btn-login">
                <div class="btn-login-content">
                    <i class="fa-solid fa-users"></i> <!-- أيقونة 3 أشخاص -->
                    <span>iBOK Login</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            
            <button class="btn-login" style="margin-bottom: 0;">
                <div class="btn-login-content">
                    <i class="fa-solid fa-building"></i> <!-- أيقونة مبنى -->
                    <span>iBOK+ Login</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- الصناديق الأربعة -->
        <div class="icon-grid">
            <div class="icon-box">
                <div class="custom-icon">
                    <i class="fa-solid fa-user main-icon"></i>
                    <span class="badge"><i class="fa-solid fa-info"></i></span>
                </div>
                <span>About Us</span>
            </div>

            <div class="icon-box">
                <div class="custom-icon">
                    <i class="fa-solid fa-file-lines main-icon"></i>
                    <span class="badge"><i class="fa-solid fa-check"></i></span>
                </div>
                <span>Terms and Conditions</span>
            </div>

            <div class="icon-box">
                <div class="pin-oval">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <span>Branches / ATMs</span>
            </div>

            <div class="icon-box">
                <div class="contact-icon">
                    <i class="fa-solid fa-phone"></i>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <span>Contact Us</span>
            </div>
        </div>

    </main>

</body>
</html>
