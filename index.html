<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Khartoum - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            background-image: 
                linear-gradient(30deg, #ffffff 12%, transparent 12.5%, transparent 87%, #ffffff 87.5%, #ffffff),
                linear-gradient(150deg, #ffffff 12%, transparent 12.5%, transparent 87%, #ffffff 87.5%, #ffffff),
                linear-gradient(30deg, #ffffff 12%, transparent 12.5%, transparent 87%, #ffffff 87.5%, #ffffff),
                linear-gradient(150deg, #ffffff 12%, transparent 12.5%, transparent 87%, #ffffff 87.5%, #ffffff),
                linear-gradient(60deg, #f0f3f1 25%, transparent 25.5%, transparent 75%, #f0f3f1 75%, #f0f3f1),
                linear-gradient(60deg, #f0f3f1 25%, transparent 25.5%, transparent 75%, #f0f3f1 75%, #f0f3f1);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------------- الهيدر المائل (أحمر وأصفر) ---------------- */
        .header {
            position: relative;
            height: 70px;
            background-color: #dcb310; /* اللون الأصفر */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            overflow: hidden;
        }

        /* الجزء الأحمر المائل */
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 45%; 
            height: 100%;
            background-color: #da291c; /* اللون الأحمر */
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%); 
            z-index: 1;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2; 
        }

        .logo-img {
            height: 35px;
            width: auto;
            object-fit: contain;
        }

        .header-text {
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        .header-text h1 {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.1;
        }

        .header-text span {
            font-size: 8px;
            font-weight: 400;
        }

        .header-right {
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            z-index: 2;
            text-align: right;
            max-width: 120px;
            line-height: 1.3;
        }

        /* ---------------- المحتوى ---------------- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            width: 100%;
            max-width: 450px; /* عرض مناسب للموبايل */
            margin: 0 auto;
        }

        /* بطاقة تسجيل الدخول */
        .login-card {
            background-color: white;
            border-radius: 6px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            border: 1px solid #eaeaea;
        }

        .login-card h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .btn-login {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background-color: #da291c;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        /* المربع الأبيض بتاع الأيقونة */
        .btn-icon-left {
            background-color: #fff;
            color: #da291c;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 12px;
            margin-right: 10px;
        }

        .btn-login-content {
            display: flex; 
            align-items: center;
        }

        .btn-login .fa-arrow-right {
            font-size: 12px;
        }

        /* ---------------- الصناديق الأربعة (4 بالعرض دايماً) ---------------- */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 أعمدة حتى في الموبايل */
            gap: 8px;
            margin-bottom: 20px;
            width: 100%;
        }

        .icon-box {
            background-color: white;
            border-radius: 6px;
            padding: 10px 4px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            font-size: 8px;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid #eaeaea;
            height: 100%;
            line-height: 1.2;
        }

        .icon-box i {
            font-size: 16px;
            color: #da291c;
        }

        /* ---------------- صورة المبنى (اللي كانت ناقصة) ---------------- */
        .building-image {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .building-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* النص فوق الصورة */
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
            text-align: center;
            padding: 25px 15px 15px 15px;
        }

        .image-overlay h4 {
            color: #dcb310;
            font-size: 16px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .image-overlay p {
            color: #fff;
            font-size: 10px;
            line-height: 1.5;
            font-weight: 400;
        }

        /* ---------------- تظبيط اللابتوب ---------------- */
        @media (min-width: 768px) {
            .header {
                height: 80px;
                padding: 0 30px;
            }
            .header::before {
                width: 35%; /* تعديل الميلان */
            }
            .header-text h1 { font-size: 18px; }
            .header-text span { font-size: 10px; }
            .header-right { font-size: 14px; max-width: 200px; }
            .main-container { padding-top: 40px; }
            .btn-login { padding: 14px 18px; font-size: 14px; }
            .icon-box { padding: 15px 5px; font-size: 10px; }
            .icon-box i { font-size: 20px; }
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="header">
        <div class="header-left">
            <img src="i9oXDFd8_400x400.jpg" alt="BOK Logo" class="logo-img">
            <div class="header-text">
                <h1>بنك الخرطوم</h1>
                <span>Bank of Khartoum</span>
            </div>
        </div>
        <div class="header-right">
            Welcome to BOK Internet Banking
        </div>
    </header>

    <!-- المحتوى -->
    <main class="main-container">
        
        <div class="login-card">
            <h3>Login to</h3>
            
            <button class="btn-login">
                <div class="btn-login-content">
                    <span class="btn-icon-left"><i class="fa-solid fa-building-columns"></i></span>
                    <span>iBOK Login</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            
            <button class="btn-login" style="margin-bottom: 0;">
                <div class="btn-login-content">
                    <span class="btn-icon-left"><i class="fa-solid fa-mobile-screen"></i></span>
                    <span>iBOK+ Login</span>
                </div>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- الصناديق الأربعة -->
        <div class="icon-grid">
            <div class="icon-box">
                <i class="fa-solid fa-user"></i>
                <span>About Us</span>
            </div>
            <div class="icon-box">
                <i class="fa-solid fa-file-contract"></i>
                <span>Terms and<br>Conditions</span>
            </div>
            <div class="icon-box">
                <i class="fa-solid fa-location-dot"></i>
                <span>Branches /<br>ATMs</span>
            </div>
            <div class="icon-box">
                <i class="fa-solid fa-phone-volume"></i>
                <span>Contact Us</span>
            </div>
        </div>

        <!-- صورة المبنى -->
        <div class="building-image">
            <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=800&auto=format&fit=crop" alt="Bank Building">
            <div class="image-overlay">
                <h4>اي بوك و اي بوك بلس</h4>
                <p>الخدمات المصرفية عبر الانترنت من بنك الخرطوم تتيح هذه الخدمة الاطلاع على كشف الحسابات وتحويل الأموال والمدفوعات</p>
            </div>
        </div>

    </main>

</body>
</html>
