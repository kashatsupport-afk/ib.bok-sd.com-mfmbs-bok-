<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBOK - OTP Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; background-image: radial-gradient(#e0e0e0 1px, transparent 1px); background-size: 20px 20px; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background-color: #b91c23; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; color: white; position: relative; }
        .header::after { content: ''; position: absolute; top: 0; right: 0; width: 45%; height: 100%; background-color: #dcb310; z-index: 0; }
        .header-content { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 800px; margin: 0 auto; z-index: 1; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area h1 { font-size: 24px; font-weight: bold; }
        .divider { height: 30px; width: 2px; background-color: rgba(255,255,255,0.5); margin: 0 10px; }
        .header-titles h2 { font-size: 14px; font-weight: 600; }
        .header-titles p { font-size: 12px; color: #dcb310; font-weight: 600; }
        .header-right-text { color: #fff; font-size: 16px; font-weight: 500; text-align: right; max-width: 200px; line-height: 1.2; }
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; width: 100%; max-width: 500px; margin: 0 auto; }
        .page-title { font-size: 20px; color: #b91c23; margin-bottom: 20px; text-align: left; width: 100%; font-weight: 600; }
        .otp-card { background-color: white; border-radius: 8px; padding: 30px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; }
        .otp-text { font-size: 16px; color: #333; margin-bottom: 20px; line-height: 1.5; }
        .otp-text hr { border: 0; border-top: 1px solid #eee; margin-top: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
        .password-wrapper { position: relative; }
        .password-wrapper input { width: 100%; padding: 12px 15px; border: 1px solid #999; border-radius: 5px; font-size: 16px; outline: none; }
        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; font-size: 18px; }
        .btn-submit { width: 100%; padding: 14px; background-color: #f09b9e; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: 500; cursor: pointer; margin-bottom: 15px; }
        .go-login { display: block; text-align: center; font-size: 14px; color: #dcb310; text-decoration: none; font-weight: 600; }
        .footer { background-color: #333; color: white; text-align: center; padding: 20px 15px 15px; font-size: 14px; font-weight: bold; border-top: 3px solid #b91c23; margin-top: auto; }
        .social-icons { display: flex; justify-content: center; gap: 15px; margin-top: 15px; }
        .social-icons a { display: flex; align-items: center; justify-content: center; width: 35px; height: 35px; background-color: #555; color: #fff; border-radius: 50%; text-decoration: none; font-size: 16px; }
        .social-icons a.bok-icon { background-color: #fff; padding: 2px; }
        .social-icons a.bok-icon img { width: 100%; height: 100%; border-radius: 50%; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo-area">
                <h1>iBOK</h1><span style="font-size: 16px; font-weight: bold;">اي بوك</span>
                <div class="divider"></div>
                <div class="header-titles"><h2>الخدمات المصرفية عبر الإنترنت</h2><p>Internet Banking Services</p></div>
            </div>
            <div class="header-right-text">Welcome to<br>iBOK Internet Banking</div>
        </div>
    </header>

    <main class="main-container">
        <h2 class="page-title">Internet Banking - Login</h2>
        <div class="otp-card">
            <div class="otp-text">
                Please enter OTP sent to your registered mobile number and email
                <hr>
            </div>
            
            <form action="#" onsubmit="event.preventDefault(); alert('تم التحقق بنجاح! (Demo)');">
                <div class="form-group">
                    <label>Enter OTP:</label>
                    <div class="password-wrapper">
                        <input type="password" placeholder="Enter OTP">
                        <i class="fa-regular fa-eye-slash eye-icon"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Submit</button>
                <a href="individual.html" class="go-login">Go to Login</a>
            </form>
        </div>
    </main>

    <footer class="footer">
        iBOK | Bank of Khartoum 2024
        <div class="social-icons">
            <a href="#" class="bok-icon"><img src="i9oXDFd8_400x400.jpg" alt="BOK"></a>
            <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
            <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        </div>
    </footer>
</body>
</html>
